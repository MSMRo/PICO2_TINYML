[project]
name = "tinyml-biosignals-pico2"
version = "1.0.0"
description = "Complete TinyML course for Biosignal Deep Learning on Raspberry Pi Pico 2 / Pico 2 W using TensorFlow, PyTorch, and Arduino IDE"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "numpy>=1.24.0,<2.0.0",
    "scipy>=1.11.0",
    "pandas>=2.1.0",
    "matplotlib>=3.8.0",
    "scikit-learn>=1.3.0",
    "neurokit2>=0.2.7",
    "tensorflow-intel>=2.16.0,<2.17.0; sys_platform == 'win32'",
    "tensorflow>=2.16.0,<2.17.0; sys_platform != 'win32'",
    "torch>=2.2.0",
    "torchaudio>=2.2.0",
    "torchvision>=0.17.0",
    "onnx>=1.15.0,<1.17.0",
    "onnxruntime>=1.17.0",
    "onnx2tf>=1.20.0",
    "tensorflow-model-optimization>=0.8.0",
    "jupyterlab>=4.1.0",
    "notebook>=7.1.0",
    "ipywidgets>=8.1.0",
    "tqdm>=4.66.0"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["utils"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.3.0"
]
